version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # マイナー・パッチ更新は1つの PR にまとめる
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # サポートする一番古い Node.js 24（package.json の engines）に合わせるため、型定義のメジャーバージョンは上げない
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
