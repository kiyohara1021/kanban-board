name: バグ報告
description: 期待どおりに動かないところを報告する
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと
      description: どんな問題が起きたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. カードを開く
        2. 説明を空にして保存する
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: 例：macOS / Chrome 141
